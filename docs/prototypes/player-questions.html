<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player questions — simpler concepts</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   AVN Family · tokens.css
   Fills every role in /contract.md. Dark is the default; light follows the
   system unless <html data-theme="light|dark"> is set.
   Palettes: none = Nutmeg (default) · slate · moss · hibiscus · white
   Select with <html data-palette="…">. Status hues stay constant across
   palettes except White build, whose status colours follow the four face
   buttons of a controller.
   ═══════════════════════════════════════════════════════════════════ */

/* Layout: calm app shell (grouped sidebar with one sliding highlight → rail on tablet → bottom tab bar on phone).
   The demo app is a container, so Tablet / Phone previews are real layouts, not scaled screenshots. */
:root {
  color-scheme: dark;
  --font-px: 'Pixelify Sans', ui-monospace, monospace;
  --font-ui: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --r-card: 12px; --r-ctl: 9px;
  /* Style contract: shape and type dials every style must set */
  --bw: 1px; --shadow-c: transparent; --lift: none; --lift-btn: none;
  --font-label: var(--font-mono); --font-btn: var(--font-ui); --tt-btn: none; --ls-btn: normal;
  --num: var(--text); --w-display: 500;
  --ease: cubic-bezier(.2, .8, .2, 1);

  --bg: light-dark(#ece5d8, #14110d);
  --panel: light-dark(#f8f4ec, #1c1713);
  --nested: light-dark(#f1eadd, #181410);
  --raise: light-dark(#e8dfcf, #27201a);
  --line: light-dark(#dacfbb, #2f271f);
  --line-strong: light-dark(#b3a287, #4a3d31);
  --text: light-dark(#211b13, #efe6d5);
  --muted: light-dark(#5a4d3e, #b5a893);
  --dim: light-dark(#75664f, #8f826e);
  --accent: light-dark(#cf5418, #ff7f45);
  --accent-ink: light-dark(#fff7ef, #1e1109);
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--panel));
  --accent-text: color-mix(in srgb, var(--accent) 80%, var(--text));
  --bar: color-mix(in srgb, var(--accent) 50%, var(--panel));
  --dot: light-dark(rgba(33, 27, 19, .04), rgba(239, 230, 213, .028));

  --ok: light-dark(#1f8a3a, #5fd36a);      /* verified: confirmed by a check */
  --done: light-dark(#17776f, #7fd6cf);    /* done, not yet confirmed */
  --info: light-dark(#2d62a6, #86b4ea);
  --new: light-dark(#6a49b8, #bba6f2);
  --hl-orange: var(--accent); --hl-cyan: light-dark(#00839a, #3cc3cf); --hl-green: var(--ok); --hl-pink: light-dark(#b8326f, #f07ab0); --hl-violet: var(--new); --hl-gold: var(--warn);
  --warn: light-dark(#8f6400, #e8c46b);
  --bad: light-dark(#b23a2c, #f08a7e);
  --ok-soft: color-mix(in srgb, var(--ok) 13%, var(--panel));
  --done-soft: color-mix(in srgb, var(--done) 13%, var(--panel));
  --info-soft: color-mix(in srgb, var(--info) 13%, var(--panel));
  --new-soft: color-mix(in srgb, var(--new) 14%, var(--panel));
  --warn-soft: color-mix(in srgb, var(--warn) 13%, var(--panel));
  --bad-soft: color-mix(in srgb, var(--bad) 13%, var(--panel));
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: light; } }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-palette="slate"] {
  --bg: light-dark(#e0e6ed, #0f1217); --panel: light-dark(#f4f7fa, #161b22); --nested: light-dark(#ebf0f5, #12161c); --raise: light-dark(#e1e8ef, #1e252e);
  --line: light-dark(#c8d1dc, #262e39); --line-strong: light-dark(#8e9bac, #424d5b); --text: light-dark(#141a22, #dbe4ee); --muted: light-dark(#424d5a, #a6b0bb); --dim: light-dark(#5a6778, #7d8793);
  --accent: light-dark(#1d6fd1, #5aa8ff); --accent-ink: light-dark(#f4f8fc, #07111c); --dot: light-dark(rgba(20,26,34,.04), rgba(219,228,238,.028));
}
:root[data-palette="moss"] {
  --bg: light-dark(#e0e7d6, #0e130e); --panel: light-dark(#f3f7ec, #151c14); --nested: light-dark(#eaf0e1, #111811); --raise: light-dark(#e3ebda, #1d261c);
  --line: light-dark(#c7d1b8, #28342a); --line-strong: light-dark(#8c9c7b, #455841); --text: light-dark(#161c10, #dde8d2); --muted: light-dark(#444d3b, #a8b2a0); --dim: light-dark(#5b684d, #7e8976);
  --accent: light-dark(#4b8411, #9ccc4a); --accent-ink: light-dark(#f6faef, #0e1508); --dot: light-dark(rgba(22,28,16,.04), rgba(221,232,210,.028));
}
:root[data-palette="white"] {
  --bg: light-dark(#eef0f2, #121416); --panel: light-dark(#ffffff, #1b1e21); --nested: light-dark(#f5f6f8, #16181b); --raise: light-dark(#eceef1, #24282c);
  --line: light-dark(#dde1e5, #2c3136); --line-strong: light-dark(#a9b0b8, #4a5158); --text: light-dark(#15181b, #eceff2); --muted: light-dark(#4b525a, #aab1b8); --dim: light-dark(#6a727b, #828a92);
  --accent: light-dark(#1d2125, #f2f4f6); --accent-ink: light-dark(#ffffff, #121416); --dot: light-dark(rgba(21,24,27,.035), rgba(236,239,242,.03));
  --ok: light-dark(#1e8e3e, #4cc764); --bad: light-dark(#d93a3f, #ff6b6b); --info: light-dark(#2b6fc2, #5aa3ec); --warn: light-dark(#a57700, #f2c230);
}
:root[data-palette="hibiscus"] {
  --bg: light-dark(#eadde0, #150b0e); --panel: light-dark(#faf2f4, #1f1115); --nested: light-dark(#f3e7ea, #190d11); --raise: light-dark(#ecdde1, #2a171d);
  --line: light-dark(#dcc5cb, #3b2229); --line-strong: light-dark(#a88892, #5c3540); --text: light-dark(#24101a, #f1dfe3); --muted: light-dark(#5a3f47, #bfa4ab); --dim: light-dark(#74545e, #94787f);
  --accent: light-dark(#b0204a, #e0476b); --accent-ink: light-dark(#fff4f6, #1a070c); --dot: light-dark(rgba(36,16,26,.04), rgba(241,223,227,.028));
}

body{margin:0;background:transparent;color:var(--text);font:16px/1.45 var(--font-body)}button,input,select{font:inherit}button{cursor:pointer}*{box-sizing:border-box}[hidden]{display:none!important}.versions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.versions button[aria-pressed=true]{background:var(--raise);border-color:var(--line-strong)}.sample{font-size:12px;color:var(--dim);margin:10px 0}.screen{background:var(--bg);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:24px}.crumb{color:var(--dim);font-size:12px;margin-bottom:12px}h1{font:500 27px/1.2 var(--font-px);margin:0 0 22px}h2{font:500 27px/1.2 var(--font-px);margin:0 0 22px}p{margin:0}.questions{display:grid;gap:10px}.question{display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;width:100%;min-height:68px;padding:15px 18px;border:var(--bw) solid var(--line);border-radius:var(--r-ctl);background:var(--panel);color:var(--text);font-size:16px}.question:hover{background:var(--raise);border-color:var(--line-strong)}.question b{font-weight:400}.question>span{color:var(--dim)}.quiet{border:0;background:none;color:var(--muted);padding:10px 0;text-align:left;text-decoration:underline;min-height:44px}.topline{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.scope{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px;margin:18px 0}.scope>span+span::before{content:'·';margin-right:10px;color:var(--dim)}.question-title{font-size:18px;font-weight:400;margin-bottom:20px}.outcome-list{display:grid;gap:10px}.result-row{display:grid;grid-template-columns:minmax(90px,1fr) 2fr 82px;gap:14px;align-items:center;margin:18px 0}.result-name{font-size:15px}.bar{height:12px;background:var(--raise);border-radius:var(--r-ctl);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);opacity:.8}.result-row.secondary .bar>i{background:var(--muted);opacity:.8}.rate{font:500 25px var(--font-px);text-align:right}.count{display:block;color:var(--muted);font-size:12px;margin-top:3px}.other{padding-top:18px;margin-top:22px;border-top:var(--bw) solid var(--line);font-size:14px;color:var(--muted);display:grid;gap:7px}.actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}.adjust{padding:16px;margin:12px 0 20px;background:var(--nested);border-radius:var(--r-ctl);border:var(--bw) solid var(--line)}.fields{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}.fields label{display:grid;gap:6px;color:var(--muted);font-size:13px;flex:1 1 140px;min-width:0}.fields input,.fields select{width:100%;min-height:42px;padding:7px 10px;border:var(--bw) solid var(--line-strong);border-radius:var(--r-ctl);background:var(--panel);color:var(--text)}.adjust .btn{margin-top:14px}.numbers{margin-top:18px;color:var(--muted);font-size:13px}.numbers summary{cursor:pointer;min-height:36px;display:flex;align-items:center;text-decoration:underline}.numbers table{width:100%;border-collapse:collapse}.numbers td,.numbers th{text-align:left;padding:10px 3px;border-bottom:var(--bw) solid var(--line);font-size:12px}.numbers p{margin-top:10px}.players{display:grid;gap:7px;margin-top:16px}.players div{display:flex;justify-content:space-between;gap:12px;border-bottom:var(--bw) solid var(--line);padding:8px 0;font-size:13px}.btn{min-height:40px;height:auto;white-space:normal}.btn:focus-visible,.quiet:focus-visible,.question:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.reset{margin-top:18px}@media(max-width:520px){.screen{padding:18px}h1,h2{font-size:24px}.question{padding:13px;min-height:76px}.result-row{grid-template-columns:90px minmax(0,1fr) 80px;gap:10px}.result-name{font-size:14px}.scope{gap:5px 10px}.scope>span+span::before{content:none}.topline{align-items:flex-start}.btn{min-height:44px}.numbers table{table-layout:fixed}.numbers th,.numbers td{overflow-wrap:anywhere}.versions .btn{flex:1}.sample{font-size:12px}}
</style></head><body>
<div class="versions" role="group" aria-label="Concept"><button class="btn" data-mode="direct" aria-pressed="true">A · Pick a question</button><button class="btn" data-mode="guided" aria-pressed="false">B · Two small steps</button></div>
<p class="sample">Interactive concept · sample data</p>
<main class="screen" id="screen">
  <div class="crumb">Levels / Player questions</div>
  <section id="start"><h1>What would you like to check?</h1><div class="questions">
    <button class="question" type="button" data-question="speed"><b>Do slower level-1 finishers continue less?</b><span aria-hidden="true">→</span></button>
    <button class="question" type="button" data-question="ads"><b>Do players who see early ads continue less?</b><span aria-hidden="true">→</span></button>
    <button class="question" type="button" data-question="idle"><b>Do repeated idle prompts go with less progress?</b><span aria-hidden="true">→</span></button>
  </div></section>
  <section id="destination" hidden><button class="quiet" type="button" id="back-start">← Back</button><h1>Where should they get to?</h1><div class="outcome-list"><button class="question" type="button" data-target="2"><b>The next level</b><span aria-hidden="true">→</span></button><button class="question" type="button" data-target="4"><b>Level 4</b><span aria-hidden="true">→</span></button><button class="question" type="button" data-target="10"><b>Level 10</b><span aria-hidden="true">→</span></button></div></section>
  <section id="answer" hidden aria-live="polite"><div class="topline"><button type="button" class="quiet" id="back-questions">← Questions</button><button type="button" class="btn" id="adjust-button" aria-expanded="false" aria-controls="adjust">Adjust</button></div><p class="question-title" id="selected-question"></p>
    <div class="scope" id="scope"></div>
    <form class="adjust" id="adjust" hidden><div class="fields"><label id="split-label">Slow means more than (seconds)<input type="number" id="split" min="0" value="70" step="any" required></label><label>Continue means reaching<select id="target"><option value="2">Level 2</option><option value="4" selected>Level 4</option><option value="10">Level 10</option></select></label></div><button class="btn primary" type="submit">Update answer</button></form>
    <h2 id="conclusion"></h2>
    <div class="result-row"><div class="result-name"><span id="label-a"></span><span class="count" id="count-a"></span></div><div class="bar"><i id="bar-a"></i></div><strong class="rate" id="rate-a"></strong></div>
    <div class="result-row secondary"><div class="result-name"><span id="label-b"></span><span class="count" id="count-b"></span></div><div class="bar"><i id="bar-b"></i></div><strong class="rate" id="rate-b"></strong></div>
    <div class="other"><div id="missing"></div><div>11 players are still being observed</div></div>
    <div class="actions"><button type="button" class="quiet" id="players-button" aria-expanded="false" aria-controls="players">View players</button></div>
    <div class="players" id="players" hidden></div>
    <details class="numbers"><summary>Show numbers</summary><table><thead><tr><th>Players</th><th>Reached</th><th>95% range</th></tr></thead><tbody id="number-rows"></tbody></table><p id="difference"></p><p>Exploratory comparison. A difference does not show what caused it.</p></details>
  </section>
</main>
<script>
(() => {
const root=document.getElementById('screen'),$=id=>document.getElementById(id);
const titles={speed:'Do slower level-1 finishers continue less?',ads:'Do players who see early ads continue less?',idle:'Do repeated idle prompts go with less progress?'};
const people=[...Array.from({length:115},(_,i)=>({time:30+i*40/115,reach:i<72})),...Array.from({length:36},(_,i)=>({time:71+i*60/36,reach:i<17})),...Array.from({length:23},(_,i)=>({time:null,reach:i<4}))].map((p,i)=>({...p,id:`demo-player-${String(i+1).padStart(3,'0')}`,ads:i%3===0?1:0,idle:i%4,maxLevel:p.reach?4:i%2?2:1}));
let mode='direct',question='speed',target=4,groups=[];
const show=id=>['start','destination','answer'].forEach(name=>$(name).hidden=name!==id);
function interval(k,n){if(!n)return null;const p=k/n,z=1.959963984540054,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return [Math.max(0,c-h),Math.min(1,c+h)];}
function render(){
 const split=Number($('split').value);target=Number($('target').value);
 groups=question==='speed'?[people.filter(p=>p.time!==null&&p.time<=split),people.filter(p=>p.time!==null&&p.time>split)]:question==='ads'?[people.filter(p=>p.ads===0),people.filter(p=>p.ads>0)]:[people.filter(p=>p.idle<=2),people.filter(p=>p.idle>2)];
 const labels=question==='speed'?['Faster','Slower']:question==='ads'?['No early ad','Saw an early ad']:['0–2 prompts','3+ prompts'];
 const results=groups.map(g=>{const k=g.filter(p=>p.maxLevel>=target).length;return {n:g.length,k,p:g.length?k/g.length:null,ci:interval(k,g.length)};});
 const a=results[0],b=results[1];let delta=null,low=null,high=null;if(a.n&&b.n){delta=a.p-b.p;low=delta-Math.hypot(a.p-a.ci[0],b.ci[1]-b.p);high=delta+Math.hypot(a.ci[1]-a.p,b.p-b.ci[0]);}
 $('selected-question').textContent=titles[question];
 $('scope').replaceChildren(...['New players','0.1.3',`Reach level ${target}`,'First 24 hours',question==='speed'?`Split at ${split} seconds`:'Early = first 10 minutes','Test data excluded'].map(text=>{const span=document.createElement('span');span.textContent=text;return span;}));
 $('conclusion').textContent=delta===null?'Not enough players yet.':low<=0&&high>=0?'No clear answer yet.':'Continuation differed between groups.';
 ['a','b'].forEach((id,i)=>{const x=results[i];$('label-'+id).textContent=labels[i];$('count-'+id).textContent=`${x.k} of ${x.n}`;$('rate-'+id).textContent=x.p===null?'—':(100*x.p).toFixed(1)+'%';$('bar-'+id).style.width=(100*(x.p||0))+'%';});
 $('missing').textContent=question==='speed'?`${people.filter(p=>p.time===null).length} players had no recorded level-1 finish`:'5 players left out · advanced saves';
 $('split-label').hidden=question!=='speed';
 $('number-rows').innerHTML=results.map((x,i)=>`<tr><td>${labels[i]}</td><td>${x.k} / ${x.n}</td><td>${x.ci?`${(100*x.ci[0]).toFixed(1)}–${(100*x.ci[1]).toFixed(1)}%`:'—'}</td></tr>`).join('');
 $('difference').textContent=delta===null?'Both groups need players.':`Difference: ${(delta*100).toFixed(1)} percentage points · 95% range ${(100*low).toFixed(1)} to ${(100*high).toFixed(1)}.`;
 $('players').replaceChildren(...groups.flatMap((g,i)=>g.slice(0,3).map(p=>{const row=document.createElement('div'),id=document.createElement('span'),group=document.createElement('span');id.textContent=p.id;group.textContent=labels[i];row.append(id,group);return row;})));
}
function begin(type){root.querySelector('.numbers').open=false;question=type;$('adjust').hidden=true;$('adjust-button').setAttribute('aria-expanded','false');$('players').hidden=true;$('players-button').setAttribute('aria-expanded','false');if(mode==='guided'){show('destination');}else{$('target').value='4';render();show('answer');}}
document.querySelectorAll('[data-question]').forEach(button=>button.onclick=()=>begin(button.dataset.question));
document.querySelectorAll('[data-target]').forEach(button=>button.onclick=()=>{$('target').value=button.dataset.target;render();show('answer');});
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));show('start');});
$('back-start').onclick=$('back-questions').onclick=()=>show('start');
$('adjust-button').onclick=()=>{const open=$('adjust').hidden;$('adjust').hidden=!open;$('adjust-button').setAttribute('aria-expanded',String(open));if(open)(question==='speed'?$('split'):$('target')).focus();};
$('adjust').onsubmit=event=>{event.preventDefault();render();$('adjust').hidden=true;$('adjust-button').setAttribute('aria-expanded','false');};
$('players-button').onclick=()=>{const open=$('players').hidden;$('players').hidden=!open;$('players-button').setAttribute('aria-expanded',String(open));};
})();
</script></body></html>
