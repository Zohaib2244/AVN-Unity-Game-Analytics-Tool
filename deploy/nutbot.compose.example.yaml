# Example override for running NutBot's adapters from the host instead of the ones built into the
# image (for example to try a newer adapter). Copy to compose.override.yaml (merge with any existing
# one), adjust the paths, then `docker compose up -d`. The sign-ins stay in data/nutbot/home.
services:
  admin:
    volumes:
      # a folder where you ran `npm install` of deploy/nutbot/package.json (Linux binaries!)
      - /home/YOU/nutbot-adapters/node_modules:/opt/nutbot-host/node_modules:ro
    environment:
      AVN_NUTBOT_CLAUDE_ACP: /opt/nutbot-host/node_modules/.bin/claude-agent-acp
      AVN_NUTBOT_CODEX_ACP: /opt/nutbot-host/node_modules/.bin/codex-acp
      AVN_NUTBOT_OPENCODE_BIN: /opt/nutbot-host/node_modules/.bin/opencode
