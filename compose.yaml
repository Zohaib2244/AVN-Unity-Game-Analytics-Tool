name: avn-analytics

x-service: &service
  build: .
  image: avn-analytics:local
  user: "${AVN_UID:-1000}:${AVN_GID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    # Small general-purpose temp space. SQLite query spills use the data disk instead.
    - /tmp:size=32m,mode=1777
  volumes:
    - type: bind
      source: ${AVN_HOST_DATA_DIR:-./data}
      target: /data
      bind:
        create_host_path: false
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  ingest:
    <<: *service
    environment:
      AVN_DATA_DIR: /data
      AVN_ANALYTICS_WORKER_DEFAULT_ENABLED: ${AVN_ANALYTICS_WORKER_DEFAULT_ENABLED:-true}
      SQLITE_TMPDIR: ${SQLITE_TMPDIR:-/data/sqlite-tmp}
      AVN_REQUESTS_PER_MINUTE: ${AVN_REQUESTS_PER_MINUTE:-120}
    ports:
      - "${AVN_BIND_HOST:-127.0.0.1}:${AVN_INGEST_PORT:-8100}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 1.0

  admin:
    <<: *service
    environment:
      AVN_DATA_DIR: /data
      AVN_ANALYTICS_WORKER_DEFAULT_ENABLED: ${AVN_ANALYTICS_WORKER_DEFAULT_ENABLED:-true}
      SQLITE_TMPDIR: ${SQLITE_TMPDIR:-/data/sqlite-tmp}
      AVN_ADMIN_TOKEN: ${AVN_ADMIN_TOKEN:?Set AVN_ADMIN_TOKEN in .env}
      AVN_MAX_EXPORT_BYTES: ${AVN_MAX_EXPORT_BYTES:-268435456}
      AVN_READ_CACHE_SECONDS: ${AVN_READ_CACHE_SECONDS:-60}
      AVN_ANALYTICS_READ_MODE: ${AVN_ANALYTICS_READ_MODE:-legacy}
      AVN_ANALYTICS_FRESHNESS_SECONDS: ${AVN_ANALYTICS_FRESHNESS_SECONDS:-60}
      AVN_ANALYTICS_ACTIVE_VIEWS: ${AVN_ANALYTICS_ACTIVE_VIEWS:-12}
      AVN_ANALYTICS_STORAGE_BYTES: ${AVN_ANALYTICS_STORAGE_BYTES:-268435456}
      AVN_PUBLIC_INGEST_URL: ${AVN_PUBLIC_INGEST_URL:-}
      # NutBot (see README): which agent CLI to use and how it signs in
      AVN_NUTBOT: ${AVN_NUTBOT:-true}
      AVN_NUTBOT_DEFAULT_HARNESS: ${AVN_NUTBOT_DEFAULT_HARNESS:-claude}
      AVN_NUTBOT_DAILY_LIMIT: ${AVN_NUTBOT_DAILY_LIMIT:-100}
      AVN_NUTBOT_RUN_SECONDS: ${AVN_NUTBOT_RUN_SECONDS:-300}
      AVN_NUTBOT_CLAUDE_BIN: ${AVN_NUTBOT_CLAUDE_BIN:-}
      AVN_NUTBOT_CLAUDE_MODEL: ${AVN_NUTBOT_CLAUDE_MODEL:-claude-sonnet-5-5}
      AVN_NUTBOT_OPENCODE_BIN: ${AVN_NUTBOT_OPENCODE_BIN:-}
      AVN_NUTBOT_OPENCODE_MODEL: ${AVN_NUTBOT_OPENCODE_MODEL:-}
      AVN_NUTBOT_CODEX_BIN: ${AVN_NUTBOT_CODEX_BIN:-}
      AVN_NUTBOT_CODEX_MODEL: ${AVN_NUTBOT_CODEX_MODEL:-}
      AVN_NUTBOT_ALLOW_CODEX: ${AVN_NUTBOT_ALLOW_CODEX:-false}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AVN_ACCESS_TEAM_DOMAIN: ${AVN_ACCESS_TEAM_DOMAIN:-}
      AVN_ACCESS_AUDIENCE: ${AVN_ACCESS_AUDIENCE:-}
      AVN_ADMIN_EMAIL: ${AVN_ADMIN_EMAIL:-}
      AVN_LAN_ADMIN: ${AVN_LAN_ADMIN:-true}
    command: [uvicorn, "avn_analytics.api:create_admin_app", --factory, --host, "0.0.0.0", --port, "8000", --workers, "1", --limit-concurrency, "20", --no-proxy-headers]
    ports:
      - "${AVN_BIND_HOST:-127.0.0.1}:${AVN_ADMIN_PORT:-8101}:8000"
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Authorization':'Bearer '+os.environ['AVN_ADMIN_TOKEN']}); urllib.request.urlopen(request,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 1.0

  # The analytics worker (see docs/analytics-pipeline.md): copies and checks analytics facts and
  # keeps prepared answers fresh. Admins start and stop it on the Settings page; while it is
  # stopped (or this container is down) events are still collected and dashboards still work.
  worker:
    <<: *service
    environment:
      AVN_DATA_DIR: /data
      SQLITE_TMPDIR: ${SQLITE_TMPDIR:-/data/sqlite-tmp}
      AVN_ANALYTICS_WORKER_DEFAULT_ENABLED: ${AVN_ANALYTICS_WORKER_DEFAULT_ENABLED:-true}
      AVN_ANALYTICS_BATCH_ROWS: ${AVN_ANALYTICS_BATCH_ROWS:-5000}
      AVN_ANALYTICS_REFRESH_SECONDS: ${AVN_ANALYTICS_REFRESH_SECONDS:-10}
      AVN_ANALYTICS_FRESHNESS_SECONDS: ${AVN_ANALYTICS_FRESHNESS_SECONDS:-60}
      AVN_ANALYTICS_ACTIVE_VIEWS: ${AVN_ANALYTICS_ACTIVE_VIEWS:-12}
      AVN_ANALYTICS_STORAGE_BYTES: ${AVN_ANALYTICS_STORAGE_BYTES:-268435456}
    command: [python, -m, avn_analytics.materialize]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -m, avn_analytics.materialize, health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
